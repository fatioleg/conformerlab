[project]
name = "conformerlab"
version = "0.1.0"
description = "Modular conformer generation and ensemble analysis with a pluggable backend interface."
requires-python = ">=3.12"
dependencies = [
    "rdkit>=2024.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openconf = ["openconf"]
mlip = ["ase>=3.23"]            # plus one of: aimnet[ase] OR mace-torch
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformerlab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
